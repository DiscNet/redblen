name: Redblen Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Redblen-v0.4.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish pre-release for Android
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="v0.4.0-alpha-${SHORT_SHA}"
          cp app/build/outputs/apk/debug/app-debug.apk Redblen-v0.4.0-alpha.apk
          gh release create "$TAG" Redblen-v0.4.0-alpha.apk \
            --target "$GITHUB_SHA" \
            --title "Redblen v0.4.0 Alpha (${SHORT_SHA})" \
            --notes "APK Android de testes (debug). Multi-selecao de vertices, insercao conectada de vertices, refinamento de malha, simetria por eixos combinaveis e radial, pinceis de esculpir (puxar/empurrar/suavizar); materiais e camera da v0.3 preservados. Esta compilação usa assinatura de debug temporária; atualizações futuras podem exigir desinstalar a versão anterior." \
            --prerelease
